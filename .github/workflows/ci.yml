name: CI Test & Build

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    name: Run Tests & Build Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./shirt-order-system

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./shirt-order-system/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Verify Production Build
        run: npm run build
        env:
          NITRO_PRESET: vercel
          NUXT_SESSION_PASSWORD: 'ci-build-placeholder-password-must-be-at-least-32-chars'
          NUXT_DATABASE_URL: 'postgresql://dummy:dummy@ep-dummy-pooler.us-east-2.aws.neon.tech/neondb?sslmode=require'

