name: Production CI & Database Migration

on:
  push:
    branches: [main]

jobs:
  test-migrate-and-deploy:
    name: Test, Migrate & Deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./shirt-order-system

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./shirt-order-system/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Apply Database Migrations on Neon Production
        run: npm run db:migrate
        env:
          NUXT_DATABASE_URL: ${{ secrets.NUXT_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.NUXT_DATABASE_URL }}

      - name: Deploy to Vercel (Production)
        if: ${{ env.VERCEL_TOKEN != '' }}
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./shirt-order-system
          vercel-args: '--prod'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

